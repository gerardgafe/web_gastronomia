<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Recetas Caseras</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/categoria.scss">
  <link rel="stylesheet" href="./styles/styles.scss">
  <script defer type="module" src="./scripts/categoria.js"></script>
  <script defer type="module" src="./scripts/common.js"></script>
</head>

<body>

  <!-- Cabecera -->
  <include src="./src/componentes/header.html"></include>

  <main>

    <!-- Seccion -->
    <section class="recetas">

      <div class="recetas-grid">

        <article class="card-style">
          <picture>
            <source srcset="imagenes/categoria3/albondigas_bacalao.jpg?as=webp" type="image/webp"/>
            <img fetchpriority=high src="imagenes/categoria3/albondigas_bacalao.jpg">
          </picture>
          <h3>Albondigas de bacalao</h3>
          <p><i class="fa-regular fa-clock" aria-hidden="true"></i> 10 min</p>
          <a class="no-disponible" aria-label="reteta de albondigas de bacalao no disponible">
            No disponible
          </a>
        </article>

        <article class="card-style">
          <picture>
            <source srcset="imagenes/categoria3/rape_vapor.jpg?as=webp" type="image/webp"/>
            <img src="imagenes/categoria3/rape_vapor.jpg">
          </picture>
          <h3>Rape al vapor</h3>
          <p><i class="fa-regular fa-clock" aria-hidden="true"></i> 15 min</p>
          <a class="no-disponible" aria-label="reteta de rape al vapor no disponible">
            No disponible
          </a>
        </article>

        <article class="card-style">
          <picture>
            <source srcset="imagenes/categoria3/besugo_horno.jpg?as=webp" type="image/webp"/>
            <img loading="lazy" src="imagenes/categoria3/besugo_horno.jpg">
          </picture>
          <h3>Besugo al horno</h3>
          <p><i class="fa-regular fa-clock" aria-hidden="true"></i> 15 min</p>
          <a class="no-disponible" aria-label="reteta de besugo al horno no disponible">
            No disponible
          </a>
        </article>

        <article class="card-style">
          <picture>
            <source srcset="imagenes/categoria3/salmon_teriyaki.jpg?as=webp" type="image/webp"/>
            <img loading="lazy" src="imagenes/categoria3/salmon_teriyaki.jpg">
          </picture>
          <h3>Salmón teriyaki</h3>
          <p><i class="fa-regular fa-clock" aria-hidden="true"></i> 10 min</p>
          <a class="no-disponible" aria-label="reteta de salmon teriyaki no disponible">
            No disponible
          </a>
        </article>

        <article class="card-style">
          <picture>
            <source srcset="imagenes/categoria3/bacalao_lagareiro.jpg?as=webp" type="image/webp"/>
            <img loading="lazy" src="imagenes/categoria3/bacalao_lagareiro.jpg">
          </picture>
          <h3>Bacalao al Lagareiro</h3>
          <p><i class="fa-regular fa-clock" aria-hidden="true"></i> 45 min</p>
          <a class="no-disponible" aria-label="reteta de bacalao a lagareiro no disponible">
            No disponible
          </a>
        </article>

      </div>

    </section>

    <!-- Boton scroll -->
    <include src="./src/componentes/button_scroll.html"></include>

  </main>

  <!-- Footer -->
  <include src="./src/componentes/footer.html"></include>

</body>

</html>
